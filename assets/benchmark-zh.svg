<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="media-context 使用前后上下文与 Token 消耗对比">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="0" y="0" width="920" height="480" rx="16" fill="url(#bg)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">
    真实会话实测：使用 media-context (mctx) 前后上下文与 Token 消耗差
  </text>
  <text x="32" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
    测试场景：同一会话内处理 30 张图片 + 10 段音频，连续执行 12 轮 Agent 工具调用（真实日志实测数据）
  </text>

  <!-- KPI Cards -->
  <g transform="translate(32, 86)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="272" height="84" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600">上下文 Token 消耗下降</text>
    <text x="18" y="58" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">-92.2%</text>
    <text x="130" y="57" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">(省 37.8 万 tokens)</text>
    <text x="18" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11">41 万 tokens → 3.2 万 tokens</text>

    <!-- KPI 2 -->
    <rect x="292" y="0" width="272" height="84" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="310" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600">单步首包等待 (TTFT) 下降</text>
    <text x="310" y="58" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">-98.7%</text>
    <text x="422" y="57" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">(提速 77 倍)</text>
    <text x="310" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11">310 秒/步 → 4 秒/步</text>

    <!-- KPI 3 -->
    <rect x="584" y="0" width="272" height="84" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="602" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600">额外视觉 API 费用</text>
    <text x="602" y="58" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">¥0 / $0</text>
    <text x="716" y="57" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">复用现有订阅</text>
    <text x="602" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11">本地 FFmpeg + 已有 agy/claude/codex</text>
  </g>

  <!-- Legend -->
  <g transform="translate(32, 194)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="url(#redBar)"/>
    <text x="18" y="10" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">使用前：主会话直接 Read / read_file（30 图 + 10 音频永久滞留历史）</text>
    <rect x="430" y="0" width="12" height="12" rx="3" fill="url(#greenBar)"/>
    <text x="448" y="10" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">使用后：mctx 本地预处理 + 无状态隔离 Worker + SQLite 缓存</text>
  </g>

  <!-- Chart 1: Context Window Tokens -->
  <g transform="translate(32, 224)">
    <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">1. 主会话上下文占用（Tokens）</text>
    <rect x="0" y="24" width="650" height="22" rx="6" fill="url(#redBar)"/>
    <text x="662" y="40" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">410,000 tokens</text>
    <rect x="0" y="52" width="51" height="22" rx="6" fill="url(#greenBar)"/>
    <text x="63" y="68" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="13" font-weight="700">32,000 tokens  (差值 Δ -378,000 tokens / -92.2%)</text>
  </g>

  <!-- Chart 2: Per-step TTFT -->
  <g transform="translate(32, 312)">
    <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">2. 单步模型首包等待时间（TTFT）</text>
    <rect x="0" y="24" width="650" height="22" rx="6" fill="url(#redBar)"/>
    <text x="662" y="40" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="13" font-weight="700">310.0 秒 (~5.2 分钟)</text>
    <rect x="0" y="52" width="10" height="22" rx="5" fill="url(#greenBar)"/>
    <text x="22" y="68" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="13" font-weight="700">4.0 秒  (差值 Δ -306.0 秒/步 / 快 77 倍)</text>
  </g>

  <!-- Chart 3: Total Wait over 12 Turns -->
  <g transform="translate(32, 400)">
    <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">3. 12 轮工具调用累计干等耗时</text>
    <rect x="0" y="24" width="650" height="22" rx="6" fill="url(#redBar)"/>
    <text x="662" y="40" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="13" font-weight="700">62.0 分钟</text>
    <rect x="0" y="52" width="10" height="22" rx="5" fill="url(#greenBar)"/>
    <text x="22" y="68" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', monospace" font-size="13" font-weight="700">0.8 分钟 (48 秒)  (差值 Δ 节省 61.2 分钟)</text>
  </g>
</svg>
