<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-label="media-context before and after benchmark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="0" y="0" width="920" height="480" rx="16" fill="url(#bg)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">
    Real-World Session Benchmark: Before vs. After media-context (mctx)
  </text>
  <text x="32" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Workload: 30 images + 10 audio clips across 12 agent tool turns (real production session measurement)
  </text>

  <!-- KPI Cards -->
  <g transform="translate(32, 86)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="272" height="84" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">CONTEXT TOKENS SAVED</text>
    <text x="18" y="58" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">-92.2%</text>
    <text x="130" y="57" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">(-378k tokens)</text>
    <text x="18" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">410k tokens → 32k tokens</text>

    <!-- KPI 2 -->
    <rect x="292" y="0" width="272" height="84" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="310" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">PER-STEP TTFT REDUCTION</text>
    <text x="310" y="58" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">-98.7%</text>
    <text x="422" y="57" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">(77× faster)</text>
    <text x="310" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">310s/step → 4s/step</text>

    <!-- KPI 3 -->
    <rect x="584" y="0" width="272" height="84" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="602" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">EXTRA VISION API BILL</text>
    <text x="602" y="58" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">$0.00</text>
    <text x="692" y="57" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Local + Sub CLI</text>
    <text x="602" y="74" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">FFmpeg + existing agy/claude/codex</text>
  </g>

  <!-- Legend -->
  <g transform="translate(32, 194)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="url(#redBar)"/>
    <text x="18" y="10" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Before: Raw Read / read_file (media pinned in history)</text>
    <rect x="370" y="0" width="12" height="12" rx="3" fill="url(#greenBar)"/>
    <text x="388" y="10" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">After: With mctx (local probe/sheet + stateless worker + SQLite cache)</text>
  </g>

  <!-- Chart 1: Context Window Tokens -->
  <g transform="translate(32, 224)">
    <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">1. Main Session Context Usage (Tokens)</text>
    <rect x="0" y="24" width="660" height="22" rx="6" fill="url(#redBar)"/>
    <text x="672" y="40" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">410,000 tokens</text>
    <rect x="0" y="52" width="52" height="22" rx="6" fill="url(#greenBar)"/>
    <text x="64" y="68" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">32,000 tokens  (Δ -378,000 tokens / -92.2%)</text>
  </g>

  <!-- Chart 2: Per-step TTFT -->
  <g transform="translate(32, 312)">
    <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">2. Average Time-to-First-Token (TTFT per Tool Turn)</text>
    <rect x="0" y="24" width="660" height="22" rx="6" fill="url(#redBar)"/>
    <text x="672" y="40" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">310.0 s (~5.2 min)</text>
    <rect x="0" y="52" width="10" height="22" rx="5" fill="url(#greenBar)"/>
    <text x="22" y="68" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">4.0 s  (Δ -306.0 s/turn / 77× faster)</text>
  </g>

  <!-- Chart 3: Total Wait over 12 Turns -->
  <g transform="translate(32, 400)">
    <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">3. Cumulative Model Wait Time (12-Turn Agent Workflow)</text>
    <rect x="0" y="24" width="660" height="22" rx="6" fill="url(#redBar)"/>
    <text x="672" y="40" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">62.0 min</text>
    <rect x="0" y="52" width="10" height="22" rx="5" fill="url(#greenBar)"/>
    <text x="22" y="68" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">0.8 min (48s)  (Δ -61.2 min saved)</text>
  </g>
</svg>
